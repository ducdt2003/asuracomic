<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trang Chủ - Asura Scans</title>
    <link rel="stylesheet" href="/css/web/web-main/home.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
<header>
    <style>
        .navbar-brand{display:flex;align-items:center;gap:10px;text-decoration:none}.brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#5b21b6);color:#fff}.brand-name{color:#fff;font-size:20px;font-weight:850}.brand-name span{color:#c084fc}.language-switcher{display:flex;padding:3px;background:#151821;border:1px solid #2b3040;border-radius:9px}.language-switcher button{border:0;background:transparent;color:#8f96a5;padding:6px 8px;border-radius:6px;font-size:11px;font-weight:800;cursor:pointer}.language-switcher button.active{background:#8b5cf6;color:#fff}
    </style>
    <nav class="navbar">
        <div class="container-fluid">
            <div class="navbar-left">
                <a th:href="@{'/asura'}" class="navbar-brand" aria-label="AsuraRank trang chủ">
                    <span class="brand-mark"><i class="fas fa-chart-bar"></i></span>
                    <span class="brand-name">Asura<span>Rank</span></span>
                </a>
                <ul class="navbar-nav d-flex flex-row">
                    <li class="nav-item"><a class="nav-link" th:href="@{'/asura'}" th:text="#{nav.home}">Trang chủ</a></li>
                    <li class="nav-item" th:if="${session.currentUser != null}">
                        <a class="nav-link" th:href="@{/asura/bookmarks}" th:text="#{nav.following}">Theo dõi</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" th:href="@{'/asura/series'}" th:text="#{nav.discover}">Khám phá</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{'/asura#rankings'}" th:text="#{nav.rankings}">Xếp hạng</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/asura/coin}" th:text="#{nav.shop}">Cửa hàng</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/asura/membership}" th:text="#{nav.membership}">Thành viên</a></li>
                </ul>
            </div>
            <div class="navbar-right">
                <div class="search-bar">
                    <form th:action="@{/asura/series}" method="get">
                        <input type="text" name="query" th:placeholder="#{nav.search}" placeholder="Tìm kiếm truyện..." id="searchInput" autocomplete="off">
                        <button type="submit"><i class="fas fa-search"></i></button>
                    </form>
                    <div id="searchResults" class="search-results"></div>
                </div>
                <th:block th:if="${session.currentUser == null}">
                    <a th:href="@{/asura/login}" class="btn btn-login" th:text="#{nav.login}">Đăng nhập</a>
                </th:block>
                <th:block th:if="${session.currentUser != null}">
                    <div class="dropdown">
                        <a class="btn btn-profile dropdown-toggle" href="#" role="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <img th:src="${session.currentUser.avatar != null ? session.currentUser.avatar : 'https://via.placeholder.com/40'}" alt="Avatar" class="rounded-circle" width="40" height="40">
                            <span th:text="${session.currentUser.username}"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li>
                                <div class="dropdown-item disabled">
                                    <i class="fas fa-user"></i> <span th:text="${session.currentUser.username}"></span>
                                </div>
                            </li>
                            <li>
                                <div class="dropdown-item disabled">
                                    <i class="fas fa-coins"></i>
                                    <span th:text="${session.currentUser.coinBalance != null ? session.currentUser.coinBalance + ' coins' : '0 coins'}">0 coins</span>
                                </div>
                            </li>
                            <li>
                                <div class="dropdown-item disabled">
                                    <i class="fas fa-crown"></i>
                                    <span th:text="${session.currentUser.vipStatus ? 'VIP' : 'Normal'}">Normal</span>
                                </div>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" th:href="@{/asura/profile}">Profile</a></li>
                            <li th:if="${session.currentUser.role.name() == 'USER'}">
                                <a class="dropdown-item" th:href="@{/asura/bookmarks}" th:text="#{nav.following}">Theo dõi</a>
                            </li>
                            <li><a class="dropdown-item" th:href="@{/asura/transaction-history}" th:text="#{nav.history}">Lịch sử giao dịch</a></li>
                            <li th:if="${session.currentUser.role.name() == 'ADMIN'}">
                                <a class="dropdown-item" th:href="@{/asura/admin/comic}">Admin Dashboard</a>
                            </li>
                            <li><a class="dropdown-item" th:href="@{/asura/logout}">Logout</a></li>
                        </ul>
                    </div>
                </th:block>
            </div>
            <div class="language-switcher" aria-label="Language selector">
                <button type="button" th:classappend="${#locale.language == 'vi'} ? ' active'" onclick="setLanguage('vi')">VI</button>
                <button type="button" th:classappend="${#locale.language == 'en'} ? ' active'" onclick="setLanguage('en')">EN</button>
            </div>
        </div>
    </nav>
    <script>
        function setLanguage(language) {
            const url = new URL(window.location.href);
            url.searchParams.set('lang', language);
            window.location.href = url.toString();
        }
    </script>
</header>

<main>
    <div class="container mt-5">
        <h1>Chào mừng đến với Asura Scans</h1>
        <p>Khám phá bộ sưu tập truyện tranh tuyệt vời của chúng tôi!</p>
    </div>
</main>

<!-- Script tìm kiếm truyện -->
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        let currentUser = [[${session.currentUser}]];

        console.log('Current User:', currentUser); // Debugging thông tin người dùng

        searchInput.addEventListener('input', async (e) => {
            const query = e.target.value.trim();
            if (query.length < 2) {
                searchResults.style.display = 'none';
                searchResults.innerHTML = '';
                return;
            }

            try {
                const response = await fetch(`/asura/api/search?query=${encodeURIComponent(query)}`);
                const comics = await response.json();

                if (comics.length === 0) {
                    searchResults.innerHTML = '<div class="search-result-item">Không tìm thấy truyện nào.</div>';
                } else {
                    searchResults.innerHTML = comics.map(comic => `
                        <a href="/asura/comic/${comic.slug}" class="search-result-item">
                            <img src="${comic.coverImage}" alt="${comic.title}">
                            <span>${comic.title}</span>
                        </a>
                    `).join('');
                }
                searchResults.style.display = 'block';
            } catch (error) {
                console.error('Lỗi tìm kiếm:', error);
                searchResults.innerHTML = '<div class="search-result-item">Đã xảy ra lỗi.</div>';
                searchResults.style.display = 'block';
            }
        });

        document.addEventListener('click', (e) => {
            if (!searchResults.contains(e.target) && e.target !== searchInput) {
                searchResults.style.display = 'none';
            }
        });
    });
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
