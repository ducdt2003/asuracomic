<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/web/web-main/home.css">
    <title>Nạp Coin | AsuraRank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/web/web-coin/shop.css">
</head>
<body class="shop-page">
<th:block th:replace="~{web/fragments/header::header}"></th:block>

<main class="shop-main">
<div class="shop-container">

    <section class="shop-hero">
        <span class="shop-kicker"><i class="fas fa-wallet"></i> ASURARANK WALLET</span>
        <h1>Nạp coin tài khoản</h1>
        <p>Chọn gói coin phù hợp và thanh toán an toàn qua PayPal.</p>

        <a th:href="@{/asura/transaction-history}" class="history-link">
            <i class="fas fa-clock-rotate-left"></i> Xem lịch sử giao dịch
        </a>
    </section>

    <div th:if="${successMessage}" class="alert shop-alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${errorMessage}" class="alert shop-alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-triangle me-2"></i> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <section class="package-section">
        <div class="package-heading">
            <div>
                <span class="shop-kicker">GÓI COIN</span>
                <h2>Chọn số coin bạn cần</h2>
            </div>
            <div class="secure-payment"><i class="fas fa-shield-halved"></i> Thanh toán bảo mật</div>
        </div>

        <div class="coin-grid">
            <article class="coin-package" th:each="pkg, stat : ${coinPackages}" th:classappend="${stat.index == 1} ? ' featured'">
                <span class="popular-badge" th:if="${stat.index == 1}">PHỔ BIẾN</span>
                <div class="coin-card-body">
                    <div class="coin-image" aria-hidden="true">
                        <i class="fas fa-coins"></i>
                    </div>

                    <h3 th:text="${pkg.coin} + ' Coins'">100 Coins</h3>
                    <p>Coin được cộng vào tài khoản ngay sau khi thanh toán.</p>

                    <div class="coin-price"
                         th:text="${#numbers.formatDecimal(pkg.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                        10,000 VNĐ
                    </div>

                    <form th:action="@{/asura/paypal/pay}" method="post">
                        <input type="hidden" name="packageId" th:value="${pkg.id}">

                        <button type="submit" class="purchase-btn"
                                th:onclick="return confirm('Bạn sẽ được chuyển hướng sang cổng PayPal để thanh toán gói này?')">
                            <i class="fab fa-paypal"></i> Thanh toán ngay
                        </button>
                    </form>
                </div>
            </article>

            <div class="empty-packages" th:if="${#lists.isEmpty(coinPackages)}">
                <i class="fas fa-box-open"></i>
                <p>Hiện tại không có gói nạp nào khả dụng.</p>
            </div>
        </div>
    </section>
</div>
</main>

<th:block th:replace="~{web/fragments/footer::footer}"></th:block>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
