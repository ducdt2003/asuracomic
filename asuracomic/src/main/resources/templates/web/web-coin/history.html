<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử giao dịch - Asura Comic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table thead { background-color: #343a40; color: white; }
        .status-success { color: #198754; font-weight: bold; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="card p-4">
        <h2 class="mb-4"><i class="fas fa-history me-2"></i> Lịch Sử Giao Dịch</h2>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Mã Giao Dịch</th>
                    <th>Ngày</th>
                    <th>Loại Giao Dịch</th>
                    <th>Số Tiền (Xu)</th>
                    <th>Trạng Thái</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${history}">
                    <td>
                        <small class="text-muted" th:text="${item.transactionCode}">PAYPAL-123</small>
                    </td>
                    <td th:text="${#temporals.format(item.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <span class="badge bg-primary">Nạp Xu</span>
                    </td>

                    <td>
                        <strong class="text-success" th:text="${'+ ' + item.amount}">+ 500</strong>
                    </td>
                    <td>
        <span th:classappend="${item.status.name() == 'SUCCESS' ? 'text-success' : 'text-danger'}"
              th:text="${item.status}">
            SUCCESS
        </span>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(history)}">
                    <td colspan="6" class="text-center py-4 text-muted">Bạn chưa có giao dịch nào.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-3">
            <a href="/asura/coin" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left"></i> Quay lại cửa hàng
            </a>
        </div>
    </div>
</div>

</body>
</html>
