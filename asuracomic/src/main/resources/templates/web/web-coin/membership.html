<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asura Scans - Membership</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/web/web-coin/membership.css">
</head>
<body>
<th:block th:replace="~{web/fragments/header::header}"></th:block>

<main>
    <div class="main-container">
        <div class="container mt-3">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </div>

        <div class="hero-section text-center py-5">
            <h1 class="hero-title">Unleash Epic Adventures!</h1>
            <p class="hero-subtitle">Choose the plan that works for you</p>
            <a href="/asura/transaction-history" class="btn btn-outline-warning">VIP Purchase History</a>
        </div>

        <div class="membership-packages container">
            <div class="row">
                <div class="col-md-4 mb-4">
                    <div class="membership-package card p-4 shadow-sm h-100">
                        <div class="membership-title h4"><i class="fas fa-moon"></i> Monthly VIP</div>
                        <p class="text-muted">Ad-free reading for 30 days</p>
                        <div class="membership-price fw-bold text-primary mb-3">349.00 Coins</div>

                        <form th:action="@{/asura/membership/buy/monthly-vip}" method="post">
                            <button type="submit" class="btn btn-primary w-100">Purchase Now</button>
                        </form>
                    </div>
                </div>

                <div class="col-md-4 mb-4">
                    <div class="membership-package card p-4 shadow-sm h-100 border-warning">
                        <div class="membership-title h4"><i class="fas fa-star"></i> Quarterly VIP</div>
                        <p class="text-muted">Ad-free reading for 90 days</p>
                        <div class="membership-price fw-bold text-primary mb-3">663.00 Coins</div>

                        <form th:action="@{/asura/membership/buy/quarterly-vip}" method="post">
                            <button type="submit" class="btn btn-warning w-100">Purchase Now</button>
                        </form>
                    </div>
                </div>

                <div class="col-md-4 mb-4">
                    <div class="membership-package card p-4 shadow-sm h-100 border-danger">
                        <div class="membership-title h4"><i class="fas fa-crown"></i> Yearly VIP</div>
                        <p class="text-muted">Ad-free reading for 365 days</p>
                        <div class="membership-price fw-bold text-primary mb-3">949.00 Coins</div>

                        <form th:action="@{/asura/membership/buy/yearly-vip}" method="post">
                            <button type="submit" class="btn btn-danger w-100">Purchase Now</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <p class="fw-bold">Your Balance: <span class="text-success" th:text="${currentUser != null ? currentUser.coinBalance : 0}">0</span> Coins</p>
        </div>
    </div>
</main>

<th:block th:replace="~{web/fragments/footer::footer}"></th:block>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
