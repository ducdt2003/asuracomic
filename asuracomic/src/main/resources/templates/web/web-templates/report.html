<main>
    <div class="main-container">
        <div class="report-container">
            <h1 class="report-title">Báo Cáo Vi Phạm</h1>
            <form class="report-form" th:action="@{/asura/report/submit}" method="post">
                <input type="hidden" name="commentId" th:value="${commentId}">
                <input type="hidden" name="comicSlug" th:value="${comicSlug}">
                <input type="hidden" name="chapterSlug" th:value="${chapterSlug}">

                <div class="form-group">
                    <label for="reason">Lý do vi phạm:</label>
                    <select id="reason" name="reason" required>
                        <option value="content_inappropriate">Nội dung không phù hợp</option>
                        <option value="copyright">Vi phạm bản quyền</option>
                        <option value="spam">Spam hoặc quảng cáo</option>
                        <option value="other">Khác</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Mô tả chi tiết:</label>
                    <textarea id="description" name="description" rows="5" placeholder="Vui lòng mô tả chi tiết vấn đề..." required></textarea>
                </div>

                <div class="form-group">
                    <button type="submit" class="submit-btn">Gửi Báo Cáo</button>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- Footer Section -->
<th:block th:replace="~{web/fragments/footer::footer}"></th:block>

    <!-- JavaScript for Password Toggle -->
    <script>
        const togglePassword = document.querySelectorAll('.toggle-password');
        togglePassword.forEach(toggle => {
            toggle.addEventListener('click', () => {
                const input = toggle.previousElementSibling;
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                toggle.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
            });
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
