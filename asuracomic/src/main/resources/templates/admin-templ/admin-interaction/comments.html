<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Super Admin | Quản lý Bình luận hệ thống</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback" />
    <link rel="stylesheet" href="/css/admin-assets/plugins/fontawesome-free/css/all.min.css" />
    <link rel="stylesheet" href="/css/admin-assets/dist/css/adminlte.min.css" />

    <style>
        .comment-card { border-radius: 10px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .user-avatar { width: 40px; height: 40px; object-fit: cover; border-radius: 50%; border: 2px solid #ddd; }
        .comment-text-full { color: #444; font-size: 0.95rem; line-height: 1.5; background: #f8f9fa; padding: 10px; border-radius: 8px; border-left: 3px solid #17a2b8; }
        .table-v-align td { vertical-align: middle !important; }
        .comic-title-small { font-size: 0.85rem; color: #666; font-weight: 600; display: block; }
        .chapter-title-small { font-size: 0.8rem; color: #007bff; }
        .sidebar-dark-info { background-color: #343a40 !important; }
        .sidebar-dark-info .nav-link.active { background-color: #17a2b8 !important; color: #fff !important; }
    </style>
</head>

<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

    <!-- ================= NAVBAR ================= -->
    <th:block th:replace="~{admin-templ/fragments/navbar :: navbar}"></th:block>
    <!-- ================= SIDEBAR ================= -->
    <th:block th:replace="~{admin-templ/fragments/sidebar-interact :: sidebar-interact}"></th:block>

    <div class="content-wrapper">
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1 class="m-0 font-weight-bold">Quản lý Bình luận</h1>
                    </div>
                </div>
            </div>
        </div>

        <section class="content">
            <div class="container-fluid">

                <div class="card mb-3">
                    <div class="card-body p-3">
                        <div class="row">
                            <div class="col-md-3">
                                <input type="text" class="form-control form-control-sm" placeholder="Tìm theo nội dung/user...">
                            </div>
                            <div class="col-md-3">
                                <select class="form-control form-control-sm">
                                    <option>Trạng thái: Tất cả</option>
                                    <option>ACTIVE (Đang hiển thị)</option>
                                    <option>REPORTED (Bị báo cáo)</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-info btn-sm btn-block"><i class="fas fa-filter"></i> Lọc</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <div class="card comment-card">
                            <div class="card-body p-0">
                                <table class="table table-hover table-v-align mb-0">
                                    <thead class="bg-light">
                                    <tr>
                                        <th style="width: 200px">ID Người dùng</th>
                                        <th style="width: 180px">Use Name</th>
                                        <th style="width: 120px">Chapter</th>
                                        <th>Nội dung bình luận</th>
                                        <th style="width: 120px">Ngày Tạo</th>
                                        <th style="width: 120px">Trạng thái</th>
                                        <th class="text-center" style="width: 150px">Thao tác</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="comment : ${commentsPage.content}">
                                        <td th:text="${comment.id}"></td>

                                        <td th:text="${comment.user.username}"></td>
                                        <td>
                                            <span th:text="${comment.chapter.title}"></span> -
                                            <span th:text="${comment.chapter.comic.title}"></span>
                                        </td>

                                        <td th:text="${comment.content}"></td>

                                        <td th:text="${comment.createdAt}"></td>

                                        <td>
                                        <span th:text="${comment.status}"
                                          class="badge badge-info"></span>
                                        </td>

                                        <td>
                                            <form th:action="@{/asura/admin/comment/{id}/delete(id=${comment.id})}"
                                                  method="post"
                                                  style="display:inline">
                                                <button class="btn btn-sm btn-danger"
                                                        onclick="return confirm('Xóa bình luận?')">
                                                    Xóa
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                    </tbody>

                                </table>

                            </div>
                            <div class="card-footer bg-white border-0 shadow-sm" th:if="${totalPages > 0}">
                                <div class="d-flex justify-content-between align-items-center">

                                    <div class="text-muted small">
                                        Trang <strong th:text="${currentPage}">1</strong> / <span th:text="${totalPages}">10</span>
                                        (Tổng cộng <span th:text="${totalItems}">100</span> bình luận)
                                    </div>

                                    <nav aria-label="Comment pagination">
                                        <ul class="pagination pagination-sm m-0">

                                            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                                                <a class="page-link" th:href="@{/asura/admin/comic/interact/comments(page=1, size=10)}">
                                                    <i class="fas fa-angle-double-left"></i>
                                                </a>
                                            </li>

                                            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                                                <a class="page-link"
                                                   th:href="@{/asura/admin/comic/interact/comments(page=${currentPage - 1}, size=10)}">
                                                    «
                                                </a>
                                            </li>

                                            <th:block th:with="start=${(currentPage - 2 > 0) ? (currentPage - 2) : 1},
                                            end=${(start + 4 > totalPages) ? totalPages : (start + 4)}">

                                                <li class="page-item"
                                                    th:each="i : ${#numbers.sequence(start, end)}"
                                                    th:classappend="${i == currentPage} ? 'active'">
                                                    <a class="page-link"
                                                       th:href="@{/asura/admin/comic/interact/comments(page=${i}, size=10)}"
                                                       th:text="${i}">1</a>
                                                </li>
                                            </th:block>

                                            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                                                <a class="page-link"
                                                   th:href="@{/asura/admin/comic/interact/comments(page=${currentPage + 1}, size=10)}">
                                                    »
                                                </a>
                                            </li>

                                            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                                                <a class="page-link" th:href="@{/asura/admin/comic/interact/comments(page=${totalPages}, size=10)}">
                                                    <i class="fas fa-angle-double-right"></i>
                                                </a>
                                            </li>
                                        </ul>
                                    </nav>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </section>
    </div>

    <footer class="main-footer text-center text-sm border-0 bg-light">
        <strong>Asura Comment Center &copy; 2025.</strong>
    </footer>
</div>

<script src="/css/admin-assets/plugins/jquery/jquery.min.js"></script>
<script src="/css/admin-assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/css/admin-assets/dist/js/adminlte.min.js"></script>

<script>
    function deleteComment(id) {
        if(confirm("Xác nhận xóa bình luận này khỏi hệ thống?")) {
            // Gọi AJAX DELETE API
            $(`#comment-${id}`).fadeOut();
        }
    }
</script>
</body>
</html>
