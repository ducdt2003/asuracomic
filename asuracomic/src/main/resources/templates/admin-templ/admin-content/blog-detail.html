<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AdminLTE 3 | Comic Details</title>

    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/css/admin-assets/plugins/fontawesome-free/css/all.min.css" />
    <!-- Ionicons -->
    <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css" />
    <!-- Theme style -->
    <link rel="stylesheet" href="/css/admin-assets/dist/css/adminlte.min.css" />
    <!-- overlayScrollbars -->
    <link rel="stylesheet" href="/css/admin-assets/plugins/overlayScrollbars/css/OverlayScrollbars.min.css" />
    <!-- EasyMDE for description editing -->
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/highlight.js/latest/styles/github.min.css" />
    <!-- Select2 for multi-select -->
    <link rel="stylesheet" href="/css/admin-assets/plugins/select2/css/select2.min.css" />
    <link rel="stylesheet" href="/css/admin-assets/dist/css/style.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
    <!-- Navbar -->
    <th:block th:replace="~{admin-templ/fragments/navbar :: navbar}"></th:block>
    <th:block th:replace="~{admin-templ/fragments/sidebar-content :: sidebar-content}"></th:block>
    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <!-- Content Header -->
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-12">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="/asura/admin/comic/content/detail">Comic</a></li>
                            <li class="breadcrumb-item active" id="comic-title-breadcrumb">Chi tiết</li>
                        </ol>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main content -->
        <section class="content">
            <div class="container-fluid">
                <div class="row py-2">
                    <div class="col-6">
                        <button type="button" class="btn btn-default" onclick="window.history.back()">
                            <i class="fas fa-chevron-left"></i> Quay lại
                        </button>
                        <a th:href="@{/asura/admin/comic/content/edit/{slug}(slug=${comic.slug})}"
                           class="btn btn-primary px-4">
                            Sửa
                        </a>

                    </div>
                    <div class="col-6 d-flex justify-content-end">
                        <button type="button" class="btn btn-danger px-4" onclick="deleteComic()">
                            Xóa
                        </button>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-8">
                                        <div class="form-group">
                                            <label>Tiêu đề</label>
                                            <input type="text" class="form-control" id="title" th:value="${comic.title}" readonly />
                                        </div>
                                        <div class="form-group">
                                            <label for="description"><b>Mô tả</b></label>
                                            <label for="description"><b>Mô tả</b></label>
                                            <textarea id="description"
                                                      class="form-control"
                                                      rows="6"
                                                      readonly>[[${comic.description}]]</textarea>

                                        </div>
                                        <div class="form-group">
                                            <label>Serialization</label>
                                            <input type="text" class="form-control" id="serialization" th:value="${comic.serialization}" readonly/>
                                        </div>

                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label>Trạng thái</label>
                                            <select id="status"
                                                    class="form-control"
                                                    th:value="${comic.status}"
                                                    disabled>
                                                <option value="ONGOING"
                                                        th:selected="${comic.status == 'ONGOING'}">
                                                    Đang tiến hành
                                                </option>
                                                <option value="COMPLETED"
                                                        th:selected="${comic.status == 'COMPLETED'}">
                                                    Hoàn thành
                                                </option>
                                            </select>

                                        </div>
                                        <div class="form-group">
                                            <label>Loại truyện</label>
                                            <select id="type"
                                                    class="form-control"
                                                    th:value="${comic.type}"
                                                    disabled>
                                                <option value="MANHWA"
                                                        th:selected="${comic.type == 'MANHWA'}">
                                                    Manhwa
                                                </option>
                                                <option value="MANGA"
                                                        th:selected="${comic.type == 'MANGA'}">
                                                    Manga
                                                </option>
                                                <option value="MANHUA"
                                                        th:selected="${comic.type == 'MANHUA'}">
                                                    Manhua
                                                </option>
                                            </select>
                                        </div>
                                        <div class="form-group">
                                            <label>Thể loại</label>
                                            <div class="select2-purple">
                                                <select class="select2 form-control"
                                                        multiple="multiple"
                                                        id="genres"
                                                        disabled>
                                                    <option th:each="comicGenre : ${comic.comicGenres}"
                                                            th:value="${comicGenre.genre.id}"
                                                            th:text="${comicGenre.genre.name}"
                                                            th:selected="${comicGenre.genre.id}">
                                                    </option>
                                                </select>
                                            </div>

                                        </div>
                                        <div class="form-group">
                                            <label>Tác giả</label>
                                            <div class="select2-purple">
                                                <select class="select2 form-control"
                                                        multiple="multiple"
                                                        id="authors"
                                                        disabled>
                                                    <option th:each="comicAuthor : ${comic.comicAuthors}"
                                                            th:value="${comicAuthor.author.id}"
                                                            th:text="${comicAuthor.author.name}"
                                                            th:selected="${comicAuthor.author.id}">
                                                    </option>
                                                </select>
                                            </div>

                                        </div>
                                        <div class="form-group">
                                            <label>Họa sĩ</label>
                                            <div class="select2-purple">
                                                <select class="select2 form-control"
                                                        multiple="multiple"
                                                        id="artists"
                                                        disabled>
                                                    <option th:each="comicArtist : ${comic.comicArtists}"
                                                            th:value="${comicArtist.artist.id}"
                                                            th:text="${comicArtist.artist.name}"
                                                            th:selected="${comicArtist.artist.id}">
                                                    </option>
                                                </select>
                                            </div>

                                        </div>
                                        <div class="form-group">
                                            <label>Hình bìa</label>
                                            <div class="thumbnail-preview-container mb-3">
                                                <img th:src="${comic.coverImage}" alt="Hình bìa" id="coverImage" style="max-width: 100%; height: auto;" />
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label>Trạng thái xuất bản</label>
                                            <select id="isPublished"
                                                    class="form-control"
                                                    th:value="${comic.isPublished}"
                                                    disabled>
                                                <option value="true"
                                                        th:selected="${comic.isPublished == true}">
                                                    Công khai
                                                </option>
                                                <option value="false"
                                                        th:selected="${comic.isPublished == false}">
                                                    Ẩn
                                                </option>
                                            </select>

                                        </div>
                                    </div>
                                </div>
                                <!-- Chapters Section -->
                                <div class="row">
                                    <div class="col-12">
                                        <div class="card">
                                            <div class="card-header">
                                                <h3 class="card-title">Danh sách chương</h3>
                                                <!--<div class="card-tools">
                                                    <a th:href="@{/asura/admin/comic/chapter/update/{comicId}(comicId=${comic.id})}" class="btn btn-sm btn-primary">Thêm chương</a>
                                                </div>-->
                                            </div>
                                            <div class="card-body">
                                                <table class="table table-bordered">
                                                    <thead>
                                                    <tr>
                                                        <th>Số chương</th>
                                                        <th>Tiêu đề</th>
                                                        <th>Lượt xem</th>
                                                        <th>Miễn phí</th>
                                                        <th>Giá coin</th>
                                                        <th>Trạng thái</th>
                                                    </tr>
                                                    </thead>
                                                    <tbody>
                                                    <tr th:each="chapter : ${chapterPage.content}">
                                                        <td th:text="${chapter.chapterNumber}"></td>
                                                        <td th:text="${chapter.title}"></td>
                                                        <td th:text="${chapter.viewCount}"></td>
                                                        <td th:text="${chapter.isFree} ? 'Có' : 'Không'"></td>
                                                        <td th:text="${chapter.coinPrice}"></td>
                                                        <td th:text="${chapter.isPublished} ? 'Công khai' : 'Ẩn'"></td>
                                                    </tr>
                                                    <tr th:if="${#lists.isEmpty(chapterPage.content)}">
                                                        <td colspan="7" class="text-center">Chưa có chương nào</td>
                                                    </tr>
                                                    </tbody>
                                                </table>
                                                <div th:if="${chapterPage.totalPages > 1}">
                                                    <ul class="pagination"
                                                        style="display: flex; justify-content: center; align-items: center; margin-top: 20px;">

                                                        <li class="page-item" th:classappend="${chapterPage.isFirst()} ? 'disabled'">
                                                            <a class="page-link"
                                                               style="color: #28a745; border: 1px solid #dee2e6; padding: 6px 12px; text-decoration: none; border-radius: 5px; background-color: #f8f9fa; transition: color 0.3s, background-color 0.3s;"
                                                               th:href="@{/asura/admin/comic/content/{slug}(slug=${comic.slug}, page=${chapterPage.number - 1}, size=${chapterPage.size})}"
                                                               th:style="${chapterPage.isFirst()} ? 'color: #6c757d; background-color: #e9ecef; cursor: not-allowed;' : 'color: #28a745;'"
                                                               onmouseover="this.style.backgroundColor='#e9ecef'; this.style.color='#218838';"
                                                               onmouseout="this.style.backgroundColor='#f8f9fa'; this.style.color='#28a745';">«</a>
                                                        </li>

                                                        <li class="page-item"
                                                            th:each="i : ${#numbers.sequence(0, chapterPage.totalPages - 1)}"
                                                            th:classappend="${i == chapterPage.number} ? 'active'"
                                                            style="margin: 0 5px;">
                                                            <a class="page-link"
                                                               style="color: #0d6efd; border: 1px solid #dee2e6; padding: 6px 12px; text-decoration: none; border-radius: 5px; background-color: #f8f9fa; transition: color 0.3s, background-color 0.3s;"
                                                               th:href="@{/asura/admin/comic/content/{slug}(slug=${comic.slug}, page=${i}, size=${chapterPage.size})}"
                                                               th:text="${i + 1}"
                                                               th:style="${i == chapterPage.number} ? 'color: #fff; background-color: #0d6efd; border-color: #0d6efd;' : ''"
                                                               onmouseover="if (!this.parentElement.classList.contains('active')) { this.style.backgroundColor='#e9ecef'; this.style.color='#0b5ed7'; }"
                                                               onmouseout="if (!this.parentElement.classList.contains('active')) { this.style.backgroundColor='#f8f9fa'; this.style.color='#0d6efd'; }"></a>
                                                        </li>

                                                        <li class="page-item" th:classappend="${chapterPage.isLast()} ? 'disabled'">
                                                            <a class="page-link"
                                                               style="color: #28a745; border: 1px solid #dee2e6; padding: 6px 12px; text-decoration: none; border-radius: 5px; background-color: #f8f9fa; transition: color 0.3s, background-color 0.3s;"
                                                               th:href="@{/asura/admin/comic/content/{slug}(slug=${comic.slug}, page=${chapterPage.number + 1}, size=${chapterPage.size})}"
                                                               th:style="${chapterPage.isLast()} ? 'color: #6c757d; background-color: #e9ecef; cursor: not-allowed;' : 'color: #28a745;'"
                                                               onmouseover="this.style.backgroundColor='#e9ecef'; this.style.color='#218838';"
                                                               onmouseout="this.style.backgroundColor='#f8f9fa'; this.style.color='#28a745';">»</a>
                                                        </li>
                                                    </ul>
                                                </div>

                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Image Selection Modal -->
        <div class="modal fade" id="modal-xl" aria-hidden="true">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title">Chọn hình bìa</h4>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">×</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <input type="file" id="imageUpload" accept="image/*" />
                        <div id="imagePreview" class="mt-3"></div>
                    </div>
                    <div class="modal-footer justify-content-between">
                        <button type="button" class="btn btn-default" data-dismiss="modal">Đóng</button>
                        <button type="button" class="btn btn-primary" onclick="saveImage()">Lưu</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="/css/admin-assets/plugins/jquery/jquery.min.js"></script>
    <!-- Bootstrap 4 -->
    <script src="/css/admin-assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- overlayScrollbars -->
    <script src="/css/admin-assets/plugins/overlayScrollbars/js/jquery.overlayScrollbars.min.js"></script>
    <!-- AdminLTE App -->
    <script src="/css/admin-assets/dist/js/adminlte.js"></script>
    <!-- EasyMDE -->
    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
    <script src="https://cdn.jsdelivr.net/highlight.js/latest/highlight.min.js"></script>
    <!-- Select2 -->
    <script src="/css/admin-assets/plugins/select2/js/select2.full.min.js"></script>

    <script>
        // Initialize Select2
        $('.select2').select2();

        // Initialize EasyMDE for description
        const easyMDE = new EasyMDE({
            element: document.getElementById('description'),
            spellChecker: false,
            maxHeight: '300px',
            renderingConfig: { codeSyntaxHighlighting: true }
        });

        // Mock data (replace with API calls in production)
        const comicData = {
            id: 1,
            title: "One Piece",
            slug: "one-piece",
            description: "The story follows the adventures of Monkey D. Luffy and his pirate crew...",
            coverImage: "https://example.com/one-piece-cover.jpg",
            viewCount: 1000000,
            followCount: 500000,
            averageRating: 4.8,
            status: "ONGOING",
            type: "MANGA",
            isPublished: true,
            serialization: "Weekly Shonen Jump",
            createdAt: "2020-01-01T00:00:00",
            updatedAt: "2025-08-14T14:57:00",
            genres: [{ id: 1, name: "Action" }, { id: 2, name: "Adventure" }],
            authors: [{ id: 1, name: "Eiichiro Oda" }],
            artists: [{ id: 1, name: "Eiichiro Oda" }],
            chapters: [
                { id: 1, chapterNumber: 1, title: "Romance Dawn", slug: "chapter-1", isFree: true, coinPrice: 0, viewCount: 50000, isPublished: true },
                { id: 2, chapterNumber: 2, title: "The Man in the Straw Hat", slug: "chapter-2", isFree: false, coinPrice: 5.00, viewCount: 45000, isPublished: true }
            ]
        };

        // Initialize data
        function initData(data) {
    $('#title').val(data.title);
    easyMDE.value(data.description || '');
    $('#serialization').val(data.serialization || '');
    $('#status').val(data.status);
    $('#type').val(data.type);
    $('#isPublished').val(data.isPublished.toString());

    // ✅ chỉ set ảnh khi có dữ liệu
    if (data.coverImage) {
        $('#coverImage').attr('src', data.coverImage);
    }

    $('#comic-title-breadcrumb').text(data.title);
}


            // Populate genres (mock API call)
            $.ajax({
                url: '/api/genres', // Replace with actual endpoint
                success: function(genres) {
                    $('#genres').empty();
                    genres.forEach(genre => {
                        const selected = data.genres.some(g => g.id === genre.id) ? 'selected' : '';
                        $('#genres').append(`<option value="${genre.id}" ${selected}>${genre.name}</option>`);
                    });
                    $('#genres').trigger('change');
                }
            });

            // Populate authors (mock API call)
            $.ajax({
                url: '/api/authors', // Replace with actual endpoint
                success: function(authors) {
                    $('#authors').empty();
                    authors.forEach(author => {
                        const selected = data.authors.some(a => a.id === author.id) ? 'selected' : '';
                        $('#authors').append(`<option value="${author.id}" ${selected}>${author.name}</option>`);
                    });
                    $('#authors').trigger('change');
                }
            });

            // Populate artists (mock API call)
            $.ajax({
                url: '/api/artists', // Replace with actual endpoint
                success: function(artists) {
                    $('#artists').empty();
                    artists.forEach(artist => {
                        const selected = data.artists.some(a => a.id === artist.id) ? 'selected' : '';
                        $('#artists').append(`<option value="${artist.id}" ${selected}>${artist.name}</option>`);
                    });
                    $('#artists').trigger('change');
                }
            });

            // Populate chapters
            $('#chapters-table').empty();
            data.chapters.forEach(chapter => {
                $('#chapters-table').append(`
                    <tr>
                        <td>${chapter.chapterNumber}</td>
                        <td>${chapter.title}</td>
                        <td>${chapter.viewCount}</td>
                        <td>${chapter.isFree ? 'Miễn phí' : 'Trả phí'}</td>
                        <td>${chapter.coinPrice}</td>
                        <td>${chapter.isPublished ? 'Công khai' : 'Ẩn'}</td>
                       <td>
            <a href="/asura/admin/comic/chapter/edit/${chapter.id}" class="btn btn-sm btn-primary">Sửa</a>
            <button class="btn btn-sm btn-danger" onclick="deleteChapter(${chapter.id})">Xóa</button>
        </td>
                    </tr>
                `);
            });
        }

        // Save comic
        function saveComic() {
            const comic = {
                id: comicData.id,
                title: $('#title').val(),
                description: easyMDE.value(),
                serialization: $('#serialization').val(),
                status: $('#status').val(),
                type: $('#type').val(),
                isPublished: $('#isPublished').val() === 'true',
                genres: $('#genres').val().map(id => ({ id: parseInt(id) })),
                authors: $('#authors').val().map(id => ({ id: parseInt(id) })),
                artists: $('#artists').val().map(id => ({ id: parseInt(id) })),
                coverImage: $('#coverImage').attr('src')
            };
            // Mock API call
            $.ajax({
                url: `/api/comics/${comic.id}`,
                method: 'PUT',
                data: JSON.stringify(comic),
                contentType: 'application/json',
                success: function(response) {
                    alert('Lưu thành công!');
                },
                error: function() {
                    alert('Lưu thất bại!');
                }
            });
        }

        // Preview comic
        function previewComic() {
            const comicId = comicData.id;
            window.open(`/comics/${comicData.slug}`, '_blank');
        }

        // Delete comic
        function deleteComic() {
            if (confirm('Bạn có chắc muốn xóa truyện này?')) {
                $.ajax({
                    url: `/api/comics/${comicData.id}`,
                    method: 'DELETE',
                    success: function() {
                        alert('Xóa thành công!');
                        window.location.href = './comics-index.html';
                    },
                    error: function() {
                        alert('Xóa thất bại!');
                    }
                });
            }
        }

        // Delete chapter
        function deleteChapter(chapterId) {
            if (confirm('Bạn có chắc muốn xóa chương này?')) {
                $.ajax({
                    url: `/api/chapters/${chapterId}`,
                    method: 'DELETE',
                    success: function() {
                        alert('Xóa chương thành công!');
                        location.reload();
                    },
                    error: function() {
                        alert('Xóa chương thất bại!');
                    }
                });
            }
        }

      // Handle image upload
      // Handle image upload
$('#imageUpload').on('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const imageUrl = e.target.result;
            // Cập nhật hình ảnh trên giao diện và trong comicData
            $('#coverImage').attr('src', imageUrl);
            $('#imagePreview').html(`<img src="${imageUrl}" style="max-width: 100%; height: auto;" />`);
            comicData.coverImage = imageUrl; // Lưu vào comicData
        };
        reader.readAsDataURL(file);
    }
});

// Save image
function saveImage() {
    const src = $('#imagePreview img').attr('src');
    if (src) {
        $('#coverImage').attr('src', src); // Cập nhật lại để đảm bảo nhất quán
        comicData.coverImage = src; // Cập nhật comicData
        $('#modal-xl').modal('hide');
        // Gửi AJAX để lưu ảnh lên server (nếu cần)
        $.ajax({
            url: `/api/comics/${comicData.id}/upload-cover`,
            method: 'POST',
            data: JSON.stringify({ coverImage: src }),
            contentType: 'application/json',
            success: function(response) {
                console.log('Hình ảnh đã được lưu lên server!');
            },
            error: function() {
                console.log('Lỗi khi lưu hình ảnh!');
            }
        });
    } else {
        alert('Vui lòng chọn hình ảnh!');
    }
}

        // Initialize with comic data
        initData(comicData);
    </script>

    <script>
        $(document).ready(function() {
            $('.select2').select2();
        });

        function deleteChapter(chapterId) {
            if (confirm('Bạn có chắc chắn muốn xóa chương này?')) {
                // Implement AJAX call to delete chapter
                $.ajax({
                    url: '/asura/admin/comic/chapter/delete/' + chapterId,
                    type: 'DELETE',
                    success: function() {
                        alert('Xóa chương thành công!');
                        location.reload();
                    },
                    error: function() {
                        alert('Lỗi khi xóa chương!');
                    }
                });
            }
        }
    </script>

    <script>
        function loadChapters(slug, page, size = 5) {
            fetch(`/asura/admin/comic/${slug}/chapters?page=${page}&size=${size}`)
                .then(res => res.text())
                .then(html => {
                    document.getElementById("chapter-container").innerHTML =
                        new DOMParser().parseFromString(html, "text/html")
                                       .getElementById("chapter-container").innerHTML;
                })
                .catch(err => console.error("Lỗi load chapters:", err));
        }
    </script>



</body>
</html>
