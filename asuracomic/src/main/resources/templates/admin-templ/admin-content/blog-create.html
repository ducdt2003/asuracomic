<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AdminLTE 3 | Tạo Truyện Mới</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback" />
  <link rel="stylesheet" href="/css/admin-assets/plugins/fontawesome-free/css/all.min.css" />
  <link rel="stylesheet" href="/css/admin-assets/dist/css/adminlte.min.css" />
  <link rel="stylesheet" href="/css/admin-assets/plugins/overlayScrollbars/css/OverlayScrollbars.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css" />
  <link rel="stylesheet" href="/css/admin-assets/plugins/select2/css/select2.min.css" />
  <link rel="stylesheet" href="/css/admin-assets/dist/css/style.css">
</head>

<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <th:block th:replace="~{admin-templ/fragments/navbar :: navbar}"></th:block>
  <th:block th:replace="~{admin-templ/fragments/sidebar-content :: sidebar-content}"></th:block>

  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-12">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="/asura/admin/comic/content/create">Comic</a></li>
              <li class="breadcrumb-item active">Tạo Truyện Mới</li>
            </ol>
          </div>
        </div>
      </div>
    </div>

    <form id="comicForm" th:action="@{/asura/admin/comic/content/create}" method="post">
      <section class="content">
        <div class="container-fluid">
          <div class="row py-2">
            <div class="col-6">
              <button type="button" class="btn btn-default" onclick="window.history.back()">
                <i class="fas fa-chevron-left"></i> Quay lại
              </button>
              <button type="submit" class="btn btn-info px-4">
                Lưu
              </button>
            </div>
          </div>

          <div class="row">
            <div class="col-12">
              <div class="card">
                <div class="card-body">
                  <div class="row">
                    <div class="col-md-8">
                      <div class="form-group">
                        <label for="title">Tiêu đề <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" required />
                      </div>
                      <div class="form-group">
                        <label for="description">Mô tả</label>
                        <textarea id="description" name="description"></textarea>
                      </div>
                      <div class="form-group">
                        <label for="serialization">Serialization</label>
                        <input type="text" class="form-control" id="serialization" name="serialization" />
                      </div>
                    </div>
                    <div class="col-md-4">
                      <div class="form-group">
                        <label for="status">Trạng thái <span class="text-danger">*</span></label>
                        <select id="status" name="status" class="form-control" required>
                          <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                        </select>
                      </div>
                      <div class="form-group">
                        <label for="type">Loại truyện <span class="text-danger">*</span></label>
                        <select id="type" name="type" class="form-control" required>
                          <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                        </select>
                      </div>
                      <div class="form-group">
                        <label for="genres">Thể loại <span class="text-danger">*</span></label>
                        <select class="select2 form-control" multiple id="genres" name="genreIds" required>
                          <option th:each="g : ${genres}" th:value="${g.id}" th:text="${g.name}"></option>
                        </select>
                      </div>
                      <div class="form-group">
                        <label for="authors">Tác giả <span class="text-danger">*</span></label>
                        <select class="select2 form-control" multiple id="authors" name="authorIds" required>
                          <option th:each="a : ${authors}" th:value="${a.id}" th:text="${a.name}"></option>
                        </select>
                      </div>
                      <div class="form-group">
                        <label for="artists">Họa sĩ <span class="text-danger">*</span></label>
                        <select class="select2 form-control" multiple id="artists" name="artistIds" required>
                          <option th:each="a : ${artists}" th:value="${a.id}" th:text="${a.name}"></option>
                        </select>
                      </div>
                      <div class="form-group">
                        <label for="isPublished">Trạng thái xuất bản <span class="text-danger">*</span></label>
                        <select id="isPublished" name="isPublished" class="form-control" required>
                          <option value="true">Công khai</option>
                          <option value="false">Ẩn</option>
                        </select>
                      </div>
                      <input type="hidden" id="thumbnailInput" name="coverImage">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </form>
  </div>
</div>

<script src="/css/admin-assets/plugins/jquery/jquery.min.js"></script>
<script src="/css/admin-assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/css/admin-assets/plugins/overlayScrollbars/js/jquery.overlayScrollbars.min.js"></script>
<script src="/css/admin-assets/dist/js/adminlte.js"></script>
<script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
<script src="/css/admin-assets/plugins/select2/js/select2.full.min.js"></script>

<script>
  const easymde = new EasyMDE({
      element: document.getElementById('description'),
      spellChecker: false,
      placeholder: "Nhập mô tả truyện..."
  });

  function initSelect2WithTags(selector, placeholder) {
      $(selector).select2({
          placeholder: placeholder,
          width: '100%',
          tags: true,
          tokenSeparators: [',']
      });
  }

  initSelect2WithTags('#genres', 'Chọn hoặc nhập thể loại mới');
  initSelect2WithTags('#authors', 'Chọn hoặc nhập tác giả mới');
  initSelect2WithTags('#artists', 'Chọn hoặc nhập họa sĩ mới');

  document.getElementById('comicForm').addEventListener('submit', function(e) {
      document.getElementById('description').value = easymde.value();
  });
</script>
</body>
</html>
