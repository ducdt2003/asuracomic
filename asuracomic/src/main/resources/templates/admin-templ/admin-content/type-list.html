<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Danh sách truyện | Admin</title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback"/>
    <link rel="stylesheet" href="/css/admin-assets/plugins/fontawesome-free/css/all.min.css"/>
    <link rel="stylesheet" href="/css/admin-assets/dist/css/adminlte.min.css"/>
    <link rel="stylesheet" href="/css/admin-assets/plugins/overlayScrollbars/css/OverlayScrollbars.min.css"/>

    <style>
        #comicsTable {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
        }

        #comicsTable thead {
            background-color: #f8f9fa;
        }

        #comicsTable th, #comicsTable td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        #comicsTable tbody tr:hover {
            background-color: #f1f7ff;
        }

        .action-buttons a {
            margin: 0 6px;
            font-size: 16px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 20px;
        }

        .pagination a, .pagination span {
            padding: 6px 12px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            text-decoration: none;
        }

        .pagination .active {
            background: #007bff;
            color: #fff;
            border-color: #007bff;
        }

        .pagination .disabled {
            color: #6c757d;
            pointer-events: none;
        }
    </style>
</head>

<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

    <!-- NAVBAR -->
    <th:block th:replace="~{admin-templ/fragments/navbar :: navbar}"></th:block>

    <!-- SIDEBAR -->
    <th:block th:replace="~{admin-templ/fragments/sidebar-content :: sidebar-content}"></th:block>

    <!-- CONTENT -->
    <div class="content-wrapper">

        <div class="content-header">
            <div class="container-fluid">
                <h1 class="m-0">
                    Danh sách truyện
                    <span class="badge badge-primary ml-2" th:text="${type}"></span>
                </h1>
            </div>
        </div>

        <section class="content">
            <div class="container-fluid">

                <div class="mb-3">
                    <a class="btn btn-success"
                       th:href="@{/asura/admin/comic/content/create}">
                        <i class="fas fa-upload"></i> Upload Truyện Mới
                    </a>
                </div>

                <div class="card">
                    <div class="card-body p-0">
                        <table id="comicsTable">
                            <thead>
                            <tr>
                                <th width="60">ID</th>
                                <th>Tiêu đề</th>
                                <th>Thể loại</th>
                                <th>Lượt xem</th>
                                <th width="150">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>

                            <tr th:each="comic : ${comics}"
                                th:id="'comic-row-' + ${comic.id}">
                                <td th:text="${comic.id}"></td>

                                <td>
                                    <a th:href="@{'/asura/admin/comic/content/' + ${comic.slug}}"
                                       th:text="${comic.title}"
                                       class="font-weight-bold"></a>
                                </td>

                                <td>
                                    <span class="badge badge-info"
                                          th:text="${comic.type}"></span>
                                </td>

                                <td th:text="${#numbers.formatInteger(comic.viewCount, 0, 'COMMA')}"></td>

                                <td class="action-buttons">
                                    <a th:href="@{'/asura/admin/comic/content/edit/' + ${comic.slug}}">
                                        <i class="fas fa-edit text-primary"></i>
                                    </a>
                                    <a href="javascript:void(0)"
                                       th:onclick="'deleteComic(' + ${comic.id} + ')'">
                                        <i class="fas fa-trash-alt text-danger"></i>
                                    </a>
                                </td>
                            </tr>

                            </tbody>
                        </table>
                    </div>

                    <!-- PAGINATION -->
                    <div class="card-footer">
                        <div class="pagination">

                            <!-- Prev -->
                            <a th:if="${currentPage > 0}"
                               th:href="@{/asura/admin/comic/content/detail/type/{type}(type=${type}, page=${currentPage - 1})}">
                                «
                            </a>
                            <span th:unless="${currentPage > 0}" class="disabled">«</span>

                            <!-- Pages -->
                            <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                               th:text="${i + 1}"
                               th:classappend="${i == currentPage} ? 'active'"
                               th:href="@{/asura/admin/comic/content/detail/type/{type}(type=${type}, page=${i})}">
                            </a>

                            <!-- Next -->
                            <a th:if="${currentPage < totalPages - 1}"
                               th:href="@{/asura/admin/comic/content/detail/type/{type}(type=${type}, page=${currentPage + 1})}">
                                »
                            </a>
                            <span th:unless="${currentPage < totalPages - 1}" class="disabled">»</span>

                        </div>
                    </div>
                </div>

            </div>
        </section>
    </div>
</div>

<script src="/css/admin-assets/plugins/jquery/jquery.min.js"></script>
<script src="/css/admin-assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/css/admin-assets/dist/js/adminlte.js"></script>

<script>
    function deleteComic(id) {
        if (!confirm("Bạn có chắc chắn muốn xóa truyện này?")) return;
        alert("Demo UI – chưa gọi backend");
    }
</script>

</body>
</html>
